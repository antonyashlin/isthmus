name: Deploy to Cloudflare Pages

# Push to main -> build the static export -> publish it to Cloudflare Pages.
#
# The site is a Next.js static export, so the build has to happen somewhere;
# Pages' own git integration would need the build configured on its side, and
# doing it here keeps the build identical to the one run locally.
#
# Replaces an earlier Hostinger FTP workflow. The domain is served by
# Cloudflare Pages, so that workflow was deploying to a host nothing pointed
# at — and failing on every push because its FTP secrets were never set.

on:
  push:
    branches: [main]
    paths:
      - "react/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # lets you redeploy by hand from the Actions tab

concurrency:
  # A second push while one deploy is uploading would interleave two file sets.
  # Queue instead, and never cancel a run that is already publishing.
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install
        working-directory: react
        run: npm ci

      - name: Typecheck
        working-directory: react
        run: npx tsc --noEmit

      # `npm run build` runs split-build.mjs, which strips the deck out of
      # out/ and fails the build if any deck file survives. The deck is a
      # confidential document and must never ship with the marketing site.
      - name: Build static export (site only)
        working-directory: react
        run: npm run build

      - name: Assert the deck is not in the site bundle
        working-directory: react
        run: |
          if ls out | grep -qi '^deck'; then
            echo "::error::deck files found in the site bundle"; exit 1
          fi
          echo "site bundle is clean"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy react/out
            --project-name=isthmus-meridian
            --branch=main
