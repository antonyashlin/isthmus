<style>
  html, body { margin: 0; padding: 0; }
  /* LinkedIn shows this at ~48px in the feed and ~130px on the page header.
     The site's 1.4-unit hairline computes to well under a pixel at 48px and
     disappears, so the avatar takes a heavier stroke and a larger mark than the
     web lockup. Same geometry, tuned for the size it is actually seen at. */
  .tile {
    width: 400px; height: 400px; background: #06121d;
    display: flex; align-items: center; justify-content: center;
  }
  .mark { width: 288px; height: 288px; color: #f2f6fa; }
</style>

<div class="tile">
  <svg class="mark" viewBox="0 0 48 48" fill="none" stroke="currentColor"
       stroke-width="2.2" stroke-linecap="round">
    <line x1="24" y1="9" x2="24" y2="39"/>
    <path d="M12.5 12 C 24 18, 24 30, 12.5 38"/>
    <path d="M35.5 12 C 24 18, 24 30, 35.5 38"/>
  </svg>
</div>
